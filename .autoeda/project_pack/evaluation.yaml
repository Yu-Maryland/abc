version: 1
project: abc-harness-stmap-advanced
family: stmap
baseline_command: map
target_iterations: 100
canary_iterations: 1
library: 7nm_lvt_ff.lib
benchmarks:
- benchmarks/i10.aig
- benchmarks/ode.abc.blif
- benchmarks/or1200.abc.blif
- benchmarks/syn2.abc.blif
build:
  command: make ABC_USE_NO_READLINE=1
  artifact: ./abc
  clean_command: make clean
baseline_flow:
  library_command: read_lib
  design_command: read
  template: './abc -c "read_lib {library}; read {design}; resyn; resyn2; dch -v; map; topo; buffer; upsize -v; dnsize -v; stime"'
candidate_flow:
  command_pattern: stmap{iteration}
  library_command: read_lib
  design_command: read
  template: './abc -c "read_lib {library}; read {design}; resyn; resyn2; dch -v; {command}; topo; buffer; upsize -v; dnsize -v; stime"'
  smoke_design: benchmarks/i10.aig
  required_help_template: './abc -c "{command} -h"'
timeouts:
  per_design_seconds: 600
  review_pass_seconds: 600
  smoke_seconds: 600
  build_seconds: 900
metrics:
- name: stime_delay_ps
  role: primary
  direction: minimize
  source: stdout
  extraction: regex_last_match
  regex: 'WireLoad\s*=\s*"[^"]*".*Area\s*=\s*([0-9]+(?:\.[0-9]+)?).*Delay\s*=\s*([0-9]+(?:\.[0-9]+)?)\s*ps'
  group: 2
  unit: ps
- name: stime_area
  role: secondary
  direction: minimize
  source: stdout
  extraction: regex_last_match
  regex: 'WireLoad\s*=\s*"[^"]*".*Area\s*=\s*([0-9]+(?:\.[0-9]+)?).*Delay\s*=\s*([0-9]+(?:\.[0-9]+)?)\s*ps'
  group: 1
objective:
  aggregation: per_benchmark_required
  compare_to: baseline_command
  ranking:
    primary: stime_delay_ps
    secondary: stime_area
  tie_breakers:
  - more_benchmarks_improved_delay
  - lower_geomean_area
correctness:
- type: build
  mode: builtin
  command: make ABC_USE_NO_READLINE=1
  timeout_seconds: 900
  pass_condition: exit_zero
  fail_condition: non_zero_or_timeout
- type: numbered_implementation_exists
  mode: review
  timeout_seconds: 600
  pass_condition: new stmapN command and implementation files exist
  fail_condition: missing numbered command, missing implementation, or skipped version number
- type: command_help
  mode: usage_text
  command_template: './abc -c "{command} -h"'
  timeout_seconds: 600
  pass_condition: usage text is printed for the new stmapN command; ABC help-path exit code 0 or 1 is acceptable
  fail_condition: command missing, crashes before printing usage, or has no usage text
- type: smoke_flow
  mode: command_exit_zero
  design: benchmarks/i10.aig
  command_template: './abc -c "read_lib 7nm_lvt_ff.lib; read benchmarks/i10.aig; resyn; resyn2; dch -v; {command}; topo; buffer; upsize -v; dnsize -v; stime"'
  timeout_seconds: 600
  pass_condition: exit_zero_and_parseable_stime_metrics
  fail_condition: non_zero_timeout_or_unparseable_metrics
- type: combinational_equivalence
  mode: abc_cec
  timeout_seconds: 600
  artifact_dir_template: .autoeda/runtime/results/{command}
  expected_flow: for each required benchmark, write an original strashed temporary from `read_lib {library}; read {design}; strash`; write a candidate post-flow strashed temporary from the configured candidate flow plus `strash`; then run `./abc -c "cec <original_temp> <candidate_temp>"`
  pass_condition: ABC cec reports equivalent for every required benchmark, or an explicitly logged alternate equivalence method is used only when direct cec is invalid for that benchmark format
  fail_condition: cec failure, inconclusive result, crash, timeout, missing artifact, or unlogged equivalence exception
- type: benchmark_metrics
  mode: parser
  timeout_seconds: 600
  pass_condition: all four required benchmarks produce final stime_delay_ps and stime_area
  fail_condition: any required benchmark missing, crashed, timed out, or unparseable
- type: version_log_updated
  mode: file_check
  file: /Users/cunxiy/Documents/research/autoresearch-eda/abc-harness/.autoeda/runtime/versions.md
  timeout_seconds: 600
  pass_condition: hypothesis, motivation, files, command, validation, benchmark results, correctness, review findings, commit, and next step are recorded
  fail_condition: missing or incomplete version log entry
- type: review_loop
  mode: configured_review_tool
  timeout_seconds: 600
  pass_condition: required review pass completes and accepted findings are addressed and revalidated
  fail_condition: skipped required review, unresolved accepted finding, or no revalidation
logging:
  checkpoint_file: /Users/cunxiy/Documents/research/autoresearch-eda/abc-harness/.autoeda/runtime/campaign_state.json
  version_log: /Users/cunxiy/Documents/research/autoresearch-eda/abc-harness/.autoeda/runtime/versions.md
  results_dir: /Users/cunxiy/Documents/research/autoresearch-eda/abc-harness/.autoeda/runtime/results
  required_artifacts:
  - raw abc stdout/stderr for baseline and candidate flows
  - parsed metric table per benchmark
  - cec logs and temporary design paths
  - review prompts and findings summary
  - version hypothesis and next-step recommendation
  version_log_required_fields:
  - hypothesis
  - motivation
  - files changed
  - command name
  - algorithm summary
  - validation run
  - benchmark results
  - correctness results
  - review findings accepted or rejected
  - commit
  - next-step recommendation
reporting:
  enabled: true
  trigger: on_target_completion
  format: markdown
  final_report: /Users/cunxiy/Documents/research/autoresearch-eda/abc-harness/.autoeda/runtime/final_report.md
  plots_dir: /Users/cunxiy/Documents/research/autoresearch-eda/abc-harness/.autoeda/runtime/plots
  include_trend_plots: true
  plot_requirements:
    x_axis: iteration
    style: progression_tuning
    required_traces:
    - avg_so_far
    - best_so_far
    layout_guidance: If two primary metrics dominate the study and have materially
      different scales, prefer dual-axis plots; otherwise split plots for readability.
  required_sections:
  - setup_summary
  - results_summary
  - per_benchmark_trends
  - best_reproduction_flows
  - correctness_summary
  - review_summary
parallel_jobs: 4
