version: 1
auth_mode: existing
repo_root: /Users/cunxiy/Documents/research/autoresearch-eda/abc-harness
remote: origin
remote_url: https://github.com/Yu-Maryland/abc
branch: master
commit_message_template: '{family}{iteration}: {summary}'
push_mode: disabled
require_clean_tree: false
canary:
  push_mode_override: disabled
  commit_allowed: true
  push_allowed: false
retry:
  pull_rebase_once: false
forbidden:
- git push --force
- git push --force-with-lease
- git reset --hard
commit_policy:
  per_successful_iteration: one coherent commit containing implementation, build integration, evaluation artifacts, and AutoEDA runtime log updates
  include_autoeda: true
  do_not_ignore_autoeda: true
  preserve_unrelated_user_changes: true
push_policy:
  full_campaign: disabled by default; enable only after the user explicitly changes push_mode and confirms the remote target
  canary: disabled
safety_notes:
- The configured origin is https://github.com/Yu-Maryland/abc on branch master, so autonomous pushes are disabled in this pack.
- Successful iterations may still create local commits when commit_policy requirements pass.
- Do not run automatic pull --rebase or other history-rewriting recovery; preserve unrelated user and campaign changes.
forge:
  provider: github
  host: github.com
  owner: Yu-Maryland
  repo: abc
