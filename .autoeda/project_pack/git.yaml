version: 1
auth_mode: existing
repo_root: /Users/cunxiy/Documents/research/autoresearch-eda/abc-harness
remote: origin
remote_url: https://github.com/Yu-Maryland/abc
branch: master
commit_message_template: '{family}{iteration}: {summary}'
push_mode: normal
require_clean_tree: false
canary:
  push_mode_override: disabled
  commit_allowed: true
  push_allowed: false
retry:
  pull_rebase_once: false
forbidden:
- git push --force
- git push --force-with-lease
- git reset --hard
commit_policy:
  per_successful_iteration: one coherent commit containing implementation, build integration, evaluation artifacts, and AutoEDA runtime log updates
  include_autoeda: true
  do_not_ignore_autoeda: true
  preserve_unrelated_user_changes: true
push_policy:
  full_campaign: enabled; push each successful non-canary iteration to origin/master after validation, review, and commit
  canary: disabled
safety_notes:
- The configured origin is https://github.com/Yu-Maryland/abc on branch master, and the user has explicitly enabled autonomous pushes for future full-campaign iterations.
- Canary pushes remain disabled unless the user explicitly changes canary.push_mode_override and canary.push_allowed.
- Successful iterations should create local commits when commit_policy requirements pass, then push when push_mode is normal and canary policy does not override it.
- Do not run automatic pull --rebase or other history-rewriting recovery; preserve unrelated user and campaign changes.
forge:
  provider: github
  host: github.com
  owner: Yu-Maryland
  repo: abc
